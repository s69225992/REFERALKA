<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рефералка — кабинет</title>
<style>
  :root{
    --bg:#f4f6fa; --panel:#ffffff; --panel2:#eef2f7; --line:#e2e8f0;
    --text:#1a2333; --muted:#64748b; --accent:#ffd21e; --accent2:#3b6fe0;
    --green:#1a9e57; --amber:#c47d16; --red:#e0483d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
  a{color:inherit;text-decoration:none}
  .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;background:var(--bg)}
  .side{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#111;display:grid;place-items:center;font-weight:800}
  .brand b{font-size:15px}
  .brand span{display:block;color:var(--muted);font-size:11px}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);cursor:pointer}
  .nav a .ic{width:18px;text-align:center}
  .nav a:hover{background:var(--panel2);color:var(--text)}
  .nav a.active{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
  .side .spacer{flex:1}
  .roleswitch{margin-top:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px}
  .roleswitch .lbl{color:var(--muted);font-size:11px;padding:4px 6px}
  .roleswitch button{width:100%;text-align:left;background:transparent;color:var(--muted);border:0;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px}
  .roleswitch button.on{background:var(--accent);color:#111;font-weight:700}
  .main{padding:24px 30px;overflow:auto}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .top h1{font-size:22px;margin:0}
  .top .who{display:flex;align-items:center;gap:10px;color:var(--muted)}
  .top .who .av{width:32px;height:32px;border-radius:50%;background:var(--accent2);display:grid;place-items:center;color:#fff;font-weight:700}
  /* period bar */
  .period{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:18px;box-shadow:0 1px 3px rgba(16,32,60,.05)}
  .period .p{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  .period .p.on{background:var(--accent2);border-color:var(--accent2);color:#fff;font-weight:600}
  .period input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;color:var(--text);background:var(--panel)}
  .period .lab{margin-left:auto;color:var(--muted);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(16,32,60,.05)}
  .card .lbl{color:var(--muted);font-size:12px;margin-bottom:8px}
  .card .val{font-size:24px;font-weight:700}
  .card .sub{color:var(--muted);font-size:12px;margin-top:6px}
  .sec{font-size:15px;font-weight:600;margin:24px 0 12px}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(16,32,60,.05)}
  th,td{text-align:left;padding:12px 14px;font-size:13px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500}
  tr:last-child td{border-bottom:none}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .badge{font-size:11px;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .badge.paid{background:rgba(26,158,87,.13);color:var(--green)}
  .badge.pending{background:rgba(196,125,22,.14);color:var(--amber)}
  .badge.active{background:rgba(59,111,224,.13);color:var(--accent2)}
  .badge.off{background:rgba(100,116,139,.14);color:var(--muted)}
  .trf{font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(59,111,224,.10);color:var(--accent2);border:1px solid rgba(59,111,224,.2);white-space:nowrap}
  .code{font-family:ui-monospace,monospace;background:var(--panel2);color:#0f2a5e;border:1px solid var(--line);padding:4px 10px;border-radius:8px;display:inline-block}
  .row2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
  .bar{display:flex;align-items:center;gap:10px;margin:9px 0}
  .bar .nm{width:150px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .track{flex:1;background:var(--panel2);border-radius:6px;height:12px;overflow:hidden}
  .bar .fill{height:100%;background:linear-gradient(90deg,var(--accent2),#7aa2ff)}
  .bar .vv{width:86px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
  .btn{background:var(--accent);color:#111;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
  .btn.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:500}
  .muted{color:var(--muted)}
  .hero{background:linear-gradient(135deg,#eaf1ff,#f7faff);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:20px}
  .hero .big{font-size:30px;font-weight:800}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  .step{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(16,32,60,.05)}
  .step .n{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#111;font-weight:800;display:grid;place-items:center;margin-bottom:10px}
  .tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;margin-left:8px}
  .tariffcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .tcard{border:2px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;background:var(--panel)}
  .tcard.sel{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(59,111,224,.12)}
  .tcard .p1{font-size:22px;font-weight:800}
  .tcard .p2{color:var(--green);font-weight:700;margin-top:2px}
  .doc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px;max-width:820px;line-height:1.6;box-shadow:0 1px 3px rgba(16,32,60,.05)}
  .doc h3{margin:18px 0 6px;font-size:15px}
  .doc p{margin:6px 0;color:#2a3446}
  .doc .small{color:var(--muted);font-size:12px}
  select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--panel);color:var(--text)}
  .note{background:#fff8e1;border:1px solid #f0e3b0;color:#7a5c00;border-radius:10px;padding:10px 14px;font-size:13px;margin:10px 0}
.dcell{transition:transform .12s ease, box-shadow .12s ease}
.dcell:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.10)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">Р</div>
      <div><b>Рефералка</b><span id="brandSub">Таксопарк «Прайм»</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="spacer"></div>
    <div class="roleswitch">
      <div class="lbl">Роль (демо-переключатель)</div>
      <button id="rM" onclick="setRole('manager')">🧑‍💼 Кабинет менеджера</button>
      <button id="rR" onclick="setRole('referrer')">🚗 Кабинет реферера</button>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <h1 id="pageTitle">Обзор</h1>
      <div class="who"><div class="av" id="avatar">М</div><div><div id="whoName">Менеджер парка</div><div style="font-size:12px" id="whoRole">Администратор</div></div></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<script>
// ===== Тарифы приглашения (парк % / реферер %) =====
const TARIFFS = [
  {id:'t31',  park:3, ref:1.0, name:'3 / 1'},
  {id:'t415', park:4, ref:1.5, name:'4 / 1,5'},
  {id:'t52',  park:5, ref:2.0, name:'5 / 2'},
];
const tById = id => TARIFFS.find(t=>t.id===id);

// ===== Данные (демо — как первичный фолбэк; заменяются живыми из API) =====
let activeDrivers = 200;
let parkCommissionWeek = 43544.55;      // текущая комиссия парка за неделю
let allDrivers = [];                    // ВСЕ водители с комиссией за период (для вкладки «Водители»)
let topDrivers = [
  ["Щербаченко Максим",5236.00],["Лебедев Эльдар",4791.75],["Гохман Игорь",4595.88],
  ["Павлинов Виталий",4502.08],["Орловский Николай",4249.55],["Абдулов Олимджон",3831.43],
  ["Маркосян Николай",3663.50],["Корнеев Данил",2748.52],["Овсепян Карен",2574.63],["Мударов Анзор",2173.15]
];
// оборот = комиссия / 3% (базовая ставка парка)
const turnoverOf = comm => comm/0.03;

// Рефералы: у каждого свой тариф (на какой привели). В живом режиме — пусто, пока рефереры не привязаны.
let referrals = [
  {referrer:"Карен Овсепян", referred:"Данил Корнеев",   comm:2748.52, tariff:'t31',  status:"active"},
  {referrer:"Карен Овсепян", referred:"Анзор Мударов",    comm:2173.15, tariff:'t415', status:"active"},
  {referrer:"Карен Овсепян", referred:"Олимджон Абдулов", comm:3831.43, tariff:'t52',  status:"active"},
  {referrer:"Игорь Гохман",  referred:"Николай Маркосян", comm:3663.50, tariff:'t31',  status:"active"},
  {referrer:"Игорь Гохман",  referred:"Виталий Павлинов", comm:4502.08, tariff:'t415', status:"active"},
  {referrer:"Эльдар Лебедев",referred:"Николай Орловский",comm:4249.55, tariff:'t31',  status:"active"},
  {referrer:"Максим Щербаченко", referred:"Новый водитель", comm:0,      tariff:'t31',  status:"off"},
];
const fmt = n => (n).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
// доход реферера = его % с оборота приведённого
const refEarn = r => { const t=tById(r.tariff); return Math.round(turnoverOf(r.comm)*t.ref/100*100)/100; };

// ===== Период =====
let periodFactor = 1, periodLabel = "Сегодня";
let curFrom = "", curTo = "";           // даты выбранного периода (МСК, YYYY-MM-DD) — для полей-календарей
let LIVE = false;                     // режим живых данных
let liveLoaded = false;               // пришли ли уже живые данные (до этого залогиненному показываем «…», а не демо)
let ordersCount = null;               // кол-во заказов за период (подгружается отдельно; null = загрузка)
let ordersByDriver = null;            // {driverId: кол-во заказов} за период (null = загрузка)
let dbDriversByYid = null;            // yandexId -> запись водителя из нашей БД (реферер и т.п.); null = не загружено
let agentsList = null;                // список агентов из БД
let referrersList = null;             // единый список рефереров (агенты + водители-рефереры)
let linkReqs = null;                  // заявки водителей на привязку (Telegram)
let impData = null;                   // данные кабинета реферера в режиме «просмотра как»
const DB_TARIFFS = [['3_1','3 / 1'],['4_1.5','4 / 1,5'],['5_2','5 / 2']]; // коды тарифов как в БД
const S = n => n*periodFactor;        // масштаб по периоду (только в демо-режиме)

// Границы суток берём по таймзоне парка (Москва, UTC+3, без перехода на летнее
// время), чтобы совпадать с отчётами Yandex Fleet. mskMidnightUTC(daysAgo) —
// московская полночь (сегодня минус daysAgo), выраженная в реальном UTC.
const PARK_TZ_OFFSET_MS = 3*60*60*1000;
function mskMidnightUTC(daysAgo){
  const d = new Date(Date.now() + PARK_TZ_OFFSET_MS);
  d.setUTCHours(0,0,0,0);
  d.setUTCDate(d.getUTCDate() - daysAgo);
  return d.getTime() - PARK_TZ_OFFSET_MS;
}
// Сегодняшняя календарная дата парка (YYYY-MM-DD) — «свежее» значение по умолчанию
// для полей-календарей; пересчитывается при каждом рендере, поэтому не «протухает».
function mskTodayStr(){
  return new Date(Date.now() + PARK_TZ_OFFSET_MS).toISOString().slice(0,10);
}
// Московская дата начала/конца из ISO. Конец периода — исключительная граница (-1 мс).
function mskDateOf(iso){ return new Date(new Date(iso).getTime() + PARK_TZ_OFFSET_MS).toISOString().slice(0,10); }
function mskDateOfEnd(iso){ return new Date(new Date(iso).getTime() - 1 + PARK_TZ_OFFSET_MS).toISOString().slice(0,10); }
function weekAgoRange(days){
  const to = mskMidnightUTC(0);
  const from = mskMidnightUTC(days);
  return [new Date(from).toISOString(), new Date(to).toISOString()];
}
function setPeriod(f,label){
  periodLabel=label;
  if(LIVE){ const [a,b]=weekAgoRange(Math.round(f*7)); curFrom=mskDateOf(a); curTo=mskDateOfEnd(b); periodFactor=1; loadLive(a,b,label); }
  else { periodFactor=f; render(); }
}
// Диапазон одного дня: offset 0 = сегодня, 1 = вчера (окно ровно московские сутки).
function dayRange(offset){
  const start=mskMidnightUTC(offset);
  const end=start+86400000;
  return [new Date(start).toISOString(), new Date(end).toISOString()];
}
function setDay(offset,label){
  periodLabel=label;
  if(LIVE){ const [a,b]=dayRange(offset); curFrom=mskDateOf(a); curTo=mskDateOfEnd(b); loadLive(a,b,label); }
  else { periodFactor=1/7; render(); }
}
function applyCustom(){
  const a=document.getElementById('cFrom').value, b=document.getElementById('cTo').value;
  if(!a||!b){return;}
  const days=Math.max(1,(new Date(b)-new Date(a))/86400000);
  const label=`${a.split('-').reverse().join('.')} – ${b.split('-').reverse().join('.')} (${Math.round(days)} дн.)`;
  periodLabel=label;
  if(LIVE){ curFrom=a; curTo=b; periodFactor=1; loadLive(a+'T00:00:00.000+03:00', b+'T23:59:59.999+03:00', label); }
  else { periodFactor=days/7; render(); }
}

// ===== Живые данные из Fleet (через /api/admin/test-report, сессионный токен) =====
async function loadLive(from,to,label){
  const token = sessionStorage.getItem('ref_token');
  if(!token){ showLogin(); return; }
  if(label) periodLabel=label;
  setBadge('loading');
  try{
    const r = await fetch(`/api/admin/test-report?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`,
      { headers: { Authorization: 'Bearer '+token } });
    if(r.status===401){ sessionStorage.removeItem('ref_token'); showLogin('Сессия истекла — войдите снова'); return; }
    const j = await r.json();
    if(!j.ok){ setBadge('error', j.error||'ошибка'); return; }
    const rep = j.report;
    const earners = (rep.rows||[]).filter(x=>x.parkCommission>0);  // водители с активностью за период
    activeDrivers = earners.length;
    parkCommissionWeek = rep.totals.parkCommission;
    allDrivers = earners.map(x=>[x.name, x.parkCommission, x.driverId]);      // все — для вкладки «Водители»
    topDrivers = earners.slice(0,10).map(x=>[x.name, x.parkCommission, x.driverId]); // топ-10 — для «Обзора»
    referrals = [];                 // живых привязок рефереров пока нет
    LIVE = true; liveLoaded = true; periodFactor = 1;
    ordersCount = null; ordersByDriver = null;   // сброс на «загрузка», подтянем отдельным запросом
    setBadge('live');
    render();
    loadOrders(from,to);              // независимо: не блокирует и не ломает дашборд
    loadDbDrivers();                  // подтянуть водителей из нашей БД (реферер, реф-код)
    loadAgents();                     // подтянуть агентов
    loadLinkReqs();                   // подтянуть заявки на привязку (Telegram)
  }catch(e){ setBadge('error', String(e)); }
}

// ===== Водители из нашей БД (реферер, реф-код) — для привязки в таблице =====
async function loadDbDrivers(){
  const token = sessionStorage.getItem('ref_token'); if(!token) return;
  try{
    const j = await fetch('/api/cabinet/drivers',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json());
    const map = {};
    (j.drivers||[]).forEach(d=>{ map[d.yandexDriverId]=d; });
    dbDriversByYid = map;
  }catch(e){ dbDriversByYid = {}; }
  if(LIVE) render();
}

// ===== Агенты из БД =====
async function loadAgents(){
  const token = sessionStorage.getItem('ref_token'); if(!token) return;
  try{
    const j = await fetch('/api/admin/agents',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json());
    agentsList = j.agents || [];
  }catch(e){ agentsList = []; }
  if(LIVE && page==='agents') render();
}

// ===== Рефереры (агенты + водители-рефереры) со статусом «в боте» =====
async function loadReferrers(){
  const token = sessionStorage.getItem('ref_token'); if(!token) return;
  try{
    const j = await fetch('/api/admin/referrers',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json());
    referrersList = j.referrers || [];
  }catch(e){ referrersList = []; }
  render(); // всегда перерисовываем — чтобы счётчик новых был виден с любой вкладки
}
// «Новый» реферер = зарегистрировался ИЛИ зашёл в бот за последние 7 дней.
const REF_NEW_MS = 7*86400000;
function refActivityTs(r){ const c=r.createdAt?new Date(r.createdAt).getTime():0; const l=r.linkedAt?new Date(r.linkedAt).getTime():0; return Math.max(c||0,l||0); }
function refIsNew(r){ return refActivityTs(r) >= Date.now()-REF_NEW_MS; }
function refNewCount(){ return (referrersList||[]).filter(refIsNew).length; }
let refFilter='new'; // какой раздел «Рефереры» открыт: 'new' | 'all'
function setRefFilter(f){ refFilter=f; render(); }

// ===== Посуточная сводка за 30 дней (для «Обзора») =====
let dailySeries = null; // [{date, orders, commission, drivers}]
async function loadDailySeries(){
  const token = sessionStorage.getItem('ref_token'); if(!token) return;
  try{
    const j = await fetch('/api/admin/daily-series?days=30',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json());
    dailySeries = j.series || [];
  }catch(e){ dailySeries = []; }
  if(page==='overview') render();
}

// Клик по карточке дня — открыть Обзор вверху за этот день.
function pickDay(ds){
  curFrom = ds; curTo = ds; periodFactor = 1;
  const label = ds.split('-').reverse().join('.');
  periodLabel = label;
  loadLive(ds+'T00:00:00.000+03:00', ds+'T23:59:59.999+03:00', label);
  try{ window.scrollTo({top:0, behavior:'smooth'}); }catch(e){ window.scrollTo(0,0); }
}

// Ручное обновление: форсим сегодня и вчера из Fleet, затем перезагружаем всё.
let _refreshing=false;
async function refreshNow(){
  const token=sessionStorage.getItem('ref_token'); if(!token){ showLogin(); return; }
  if(_refreshing) return; _refreshing=true;
  const btn=document.getElementById('btnRefresh'); const t0=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='Обновляю…'; }
  setBadge('loading');
  try{
    const today=mskTodayStr();
    const y=new Date(new Date(today+'T00:00:00Z').getTime()-86400000).toISOString().slice(0,10);
    for(const d of [y, today]){
      await fetch('/api/admin/sync-day?date='+d,{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()).catch(()=>{});
    }
    dailySeries=null; chartSeries=null;
    const a=curFrom||today, b=curTo||today;
    await loadLive(a+'T00:00:00.000+03:00', b+'T23:59:59.999+03:00', periodLabel);
    loadDailySeries(); loadChartSeries();
  }catch(e){}
  _refreshing=false;
  const b2=document.getElementById('btnRefresh'); if(b2){ b2.disabled=false; b2.textContent=t0||'⟳ Обновить'; }
}

let chartSeries = null;      // [{date, orders, commission, drivers}]
let chartDays = 90;          // текущий диапазон в днях

}
function setChartRange(d){ chartDays=d; chartSeries=null; render(); loadChartSeries(); }
// Группировка: день (<=92), неделя (<=210), иначе месяц.
function bucketSeries(series){
  const mode = chartDays<=92 ? 'day' : (chartDays<=210 ? 'week' : 'month');
  if(mode==='day') return series.map(d=>({label:d.date.slice(8,10)+'.'+d.date.slice(5,7), commission:d.commission, orders:d.orders}));
  const map=new Map();
  for(const d of series){
    let key,lab;
    if(mode==='month'){ key=d.date.slice(0,7); lab=key.slice(5,7)+'.'+key.slice(2,4); }
    else { const wk=Math.floor(new Date(d.date+'T00:00:00Z').getTime()/(7*86400000)); key='w'+wk; lab=d.date.slice(8,10)+'.'+d.date.slice(5,7); }
    let e=map.get(key); if(!e){ e={label:lab, commission:0, orders:0}; map.set(key,e); }
    e.commission+=d.commission; e.orders+=d.orders;
  }
  return [...map.values()];
}
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; const m=n<=1?1:n<=2?2:n<=5?5:10; return m*p; }
function kfmt(v){ v=Math.round(v); if(v>=1e6) return (v/1e6).toFixed(1).replace('.',',')+'M'; if(v>=1e3) return Math.round(v/1e3)+'k'; return String(v); }
// Один мини-график (одна линия). fmtTip — формат значения в подсказке.
function miniLine(points, color, fmtTip){
  const W=800,H=210,pl=66,pr=18,pt=14,pb=34, plotW=W-pl-pr, plotH=H-pt-pb;
  if(!points.length) return '<div class="muted" style="padding:10px">Нет данных за период</div>';
  const yMax=niceMax(Math.max(1,...points.map(p=>p.v)));
  const n=points.length; const X=i=> n<=1?pl+plotW/2:pl+plotW*i/(n-1); const Y=v=> pt+plotH*(1-v/yMax);
  const grid=[0,0.5,1].map(f=>{const y=pt+plotH*(1-f); return `<line x1="${pl}" y1="${y.toFixed(1)}" x2="${W-pr}" y2="${y.toFixed(1)}" stroke="rgba(0,0,0,.07)"/><text x="${pl-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="13" fill="#94a3b8">${kfmt(yMax*f)}</text>`;}).join('');
  const line=points.map((p,i)=>`${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const area=`${X(0).toFixed(1)},${(pt+plotH).toFixed(1)} `+line+` ${X(n-1).toFixed(1)},${(pt+plotH).toFixed(1)}`;
  const dots=points.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${n>40?2.5:3.5}" fill="${color}"><title>${p.label}: ${fmtTip(p.v)}</title></circle>`).join('');
  const step=Math.max(1,Math.ceil(n/6)); let xl='';
  for(let i=0;i<n;i+=step){ xl+=`<text x="${X(i).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="13" fill="#94a3b8">${points[i].label}</text>`; }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">
    ${grid}
    <polygon points="${area}" fill="${color}" opacity="0.10"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xl}
  </svg>`;
}
function chartBlockHtml(token){
  const ranges=[[30,'30 дней'],[90,'3 месяца'],[365,'Год'],[1000,'Всё']];
  const btns=ranges.map(([d,l])=>`<button class="p ${chartDays===d?'':'sec'}" onclick="setChartRange(${d})" style="padding:8px 14px">${l}</button>`).join(' ');
  let body;
  if(chartSeries===null) body = `<div class="muted" style="padding:10px">${token?'Загрузка…':'Войдите, чтобы увидеть график'}</div>`;

    ${referrals.filter(r=>r.comm>0).map((r,i)=>`<tr><td>1${i}.08.2026</td><td>${r.referrer}</td><td class="num">${fmt(S(refEarn(r)))} ₽</td><td class="code">tx_${1000+i}</td><td><span class="badge ${i%3===0?'pending':'paid'}">${i%3===0?'в очереди':'проведено'}</span></td></tr>`).join('')}
    </tbody></table>`,
  tariffs:()=>`
    <div class="muted" style="margin-bottom:12px">Тарифы приглашения. Реферер при добавлении водителя выбирает, на какой тариф его приводит: чем выше комиссия парка — тем выше вознаграждение агента.</div>
    <div class="tariffcards">
    ${TARIFFS.map(t=>`<div class="tcard sel"><div class="muted" style="font-size:12px">Комиссия парка</div><div class="p1">${t.park}%</div><div class="p2">агент ${String(t.ref).replace('.',',')}% с оборота</div><div class="muted" style="font-size:12px;margin-top:8px">пожизненно, пока водитель работает</div></div>`).join('')}
      <div class="tcard" style="border-style:dashed;display:grid;place-items:center;color:var(--muted);cursor:pointer">+ добавить тариф</div>
    </div>
    <div class="note">Вознаграждение агента считается в процентах от оборота приведённого водителя и выплачивается как агентское — учитывается в расходах компании.</div>`,
  oferta:()=>ofertaDoc(false),
  settings:()=>`
    <div class="card" style="max-width:660px">
      <div class="sec" style="margin-top:0">Параметры программы</div>
      <div class="lbl">Базовая ставка</div>
      <div style="margin:6px 0 16px">Реферер (агент) получает <b>1% с оборота</b> приведённого водителя по тарифу «3 / 1». Другие тарифы — в разделе «Тарифы».</div>
      <div class="lbl">Категории комиссии парка (Fleet API)</div>
      <div style="margin:6px 0 16px"><span class="code">partner_ride_fee</span> <span class="code">partner_subscription_fee</span> <span class="code">partner_bonus_fee</span></div>
      <div class="lbl">Периодичность расчёта</div>
      <div style="margin:6px 0 16px">Раз в неделю, понедельник 03:00 (МСК)</div>
      <div class="lbl">Учёт выплат</div>
      <div style="margin:6px 0 16px">Агентское вознаграждение · расходы компании · выгрузка для бухгалтерии</div>
      <div class="lbl">Fleet API</div>
      <div style="margin:6px 0"><span class="badge paid">подключён</span> <span class="muted">парк «Прайм»</span></div>
      <div style="margin-top:18px"><button class="btn">Сохранить</button></div>
    </div>`,

  // ===== Реферер =====
  r_home:()=>{
    const mine=myRefs(); const earn=mine.reduce((s,r)=>s+(r.comm>0?refEarn(r):0),0);
    return periodBar()+`
    <div class="hero">
      <div><div class="muted">Заработано на рефералах</div><div class="big" style="color:var(--green)">${fmt(S(earn))} ₽</div><div class="muted">процент с оборота приведённых водителей — пожизненно</div></div>
      <div style="text-align:right"><div class="muted">Приведено водителей</div><div class="big">${mine.length}</div></div>
    </div>
    <div class="grid">
      <div class="card"><div class="lbl">Выплачено</div><div class="val" style="color:var(--green)">${fmt(S(earn)*0.6)} ₽</div></div>
      <div class="card"><div class="lbl">Ожидает выплаты</div><div class="val" style="color:var(--amber)">${fmt(S(earn)*0.4)} ₽</div></div>
      <div class="card"><div class="lbl">Активных рефералов</div><div class="val">${mine.filter(r=>r.status==='active').length}</div></div>
    </div>
    <div class="sec">Приглашай и зарабатывай</div>
    <div class="card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="muted">Твой код:</span> <span class="code" style="font-size:16px">${me.code}</span><button class="btn" onclick="go('r_code')">Пригласить водителя</button></div>`;
  },
  r_code:()=>{
    const t=tById(me.inviteTariff);
    return `
    <div class="card" style="max-width:640px">
      <div class="sec" style="margin-top:0">Выбери тариф, на который приглашаешь</div>
      <div class="muted" style="font-size:13px;margin-bottom:12px">Чем выше комиссия парка — тем выше твой процент. Тариф закрепляется за приведённым водителем.</div>
      <div class="tariffcards">
      ${TARIFFS.map(x=>`<div class="tcard ${me.inviteTariff===x.id?'sel':''}" onclick="setInviteTariff('${x.id}')"><div class="muted" style="font-size:12px">Парк</div><div class="p1">${x.park}%</div><div class="p2">тебе ${String(x.ref).replace('.',',')}% с оборота</div></div>`).join('')}
      </div>
      <div style="margin:18px 0 6px" class="muted">Твоя ссылка (тариф «${t.name}»):</div>
      <div class="pill" style="word-break:break-all">${me.link}?t=${me.inviteTariff}</div>
      <div style="display:flex;gap:10px;margin-top:14px"><button class="btn">Скопировать ссылку</button><button class="btn sec">Отправить в WhatsApp</button></div>
      <div class="note" style="margin-top:16px">Выплаты тебе — это агентское вознаграждение. Налоги с него ты платишь сам (самозанятость/НПД). Подробнее — в разделе «Оферта».</div>
    </div>`;
  },
  r_refs:()=>periodBar()+`
    <div class="muted" style="margin-bottom:12px">Кого ты привёл и на каком тарифе. Пока водитель работает — тебе капает твой процент.</div>
    <table><thead><tr><th>Водитель</th><th>Тариф</th><th>Статус</th><th class="num">Его оборот</th><th class="num">Твой %</th><th class="num">Тебе</th></tr></thead><tbody>
    ${myRefs().map(r=>{const t=tById(r.tariff);return `<tr><td>${r.referred}</td><td><span class="trf">${t.name}</span></td><td><span class="badge ${r.status==='active'?'active':'off'}">${r.status==='active'?'работает':'не работает'}</span></td><td class="num">${fmt(S(turnoverOf(r.comm)))} ₽</td><td class="num">${String(t.ref).replace('.',',')}%</td><td class="num" style="color:var(--green)">${fmt(S(refEarn(r)))} ₽</td></tr>`}).join('')}
    </tbody></table>`,
  r_hist:()=>periodBar()+`
    <table><thead><tr><th>Период</th><th>За водителя</th><th>Тариф</th><th class="num">Начислено</th><th>Статус</th></tr></thead><tbody>
    ${myRefs().map((r,i)=>{const t=tById(r.tariff);return `<tr><td>${periodLabel.split('(')[0]}</td><td>${r.referred}</td><td><span class="trf">${t.name}</span></td><td class="num">${fmt(S(refEarn(r)))} ₽</td><td><span class="badge ${i===0?'pending':'paid'}">${i===0?'ожидает':'выплачено'}</span></td></tr>`}).join('')}
    </tbody></table>
    <div class="muted" style="margin-top:10px;font-size:12px">Выплаты приходят на твой баланс в Яндекс Про.</div>`,
  r_oferta:()=>ofertaDoc(true),
  r_how:()=>`
    <div class="steps">
      <div class="step"><div class="n">1</div><b>Выбери тариф и поделись</b><div class="muted" style="margin-top:6px">Например, парк 3% / тебе 1% с оборота.</div></div>
      <div class="step"><div class="n">2</div><b>Он подключается</b><div class="muted" style="margin-top:6px">По твоей ссылке, тариф закрепляется за ним.</div></div>
      <div class="step"><div class="n">3</div><b>Он работает</b><div class="muted" style="margin-top:6px">Выполняет заказы — идёт оборот.</div></div>
      <div class="step"><div class="n">4</div><b>Тебе капает %</b><div class="muted" style="margin-top:6px">Твой процент с его оборота — пожизненно, автоматически.</div></div>
    </div>
    <div class="card" style="margin-top:18px"><b>Пример заработка</b><div class="muted" style="margin-top:8px">3 активных водителя на разных тарифах — уже <b style="color:var(--green)">${fmt(myRefs().reduce((s,r)=>s+(r.comm>0?refEarn(r):0),0))} ₽ за неделю</b> пассивного дохода.</div></div>`
};

// ===== Оферта (агентский договор) =====
function ofertaDoc(forReferrer){
  return `
  <div class="doc">
    <h2 style="margin-top:0">Публичная оферта — агентский договор</h2>
    <p class="small">Редакция от 11.08.2026 · Таксопарк «Прайм»</p>
    <div class="note">Черновик-шаблон. Перед публикацией проверьте у юриста и приведите в соответствие с вашими реквизитами и законодательством.</div>
    <h3>1. Термины</h3>
    <p><b>Компания</b> — таксопарк «Прайм». <b>Агент</b> — водитель-реферер, привлекающий других водителей. <b>Приведённый водитель</b> — водитель, подключившийся по ссылке/коду Агента.</p>
    <h3>2. Предмет</h3>
    <p>Агент за вознаграждение привлекает водителей к сотрудничеству с Компанией. Отношения носят агентский характер; Агент действует от своего имени.</p>
    <h3>3. Вознаграждение</h3>
    <p>За каждого приведённого водителя, выполняющего заказы, Компания выплачивает Агенту вознаграждение в размере, определяемом выбранным тарифом — процент от оборота приведённого водителя (например, 1% при тарифе «3/1»). Вознаграждение начисляется пожизненно, пока приведённый водитель работает.</p>
    <h3>4. Порядок расчётов</h3>
    <p>Расчётный период — неделя. Вознаграждение начисляется по итогам периода на баланс Агента. Компания вправе удерживать/возвращать ошибочные начисления.</p>
    <h3>5. Налоги</h3>
    <p>Агент самостоятельно уплачивает налоги и сборы с полученного вознаграждения (самозанятость/НПД либо иной применимый режим). Компания не является налоговым агентом, если иное не предусмотрено законом.</p>
    <h3>6. Учёт</h3>
    <p>Выплаты являются агентским вознаграждением и учитываются Компанией как расходы.</p>
    <h3>7. Акцепт</h3>
    <p>Регистрация в кабинете и нажатие «Принять оферту» означают полное и безоговорочное согласие Агента с условиями настоящей оферты.</p>
    <div style="margin-top:18px">
    ${forReferrer
      ? (me.ofertaAccepted
          ? `<span class="badge paid">✓ Оферта принята</span> <span class="muted">11.08.2026</span>`
          : `<button class="btn" onclick="me.ofertaAccepted=true;render()">Принять оферту</button>`)
      : `<button class="btn">Редактировать текст</button> <button class="btn sec">Опубликовать новую редакцию</button>`}
    </div>
  </div>`;
}

// ===== Инициализация =====
(function init(){
  const token = sessionStorage.getItem('ref_token');
  if(token){ referrals=[]; }                  // залогинен — не показываем демо-данные, ждём живые из Fleet
  // восстановить активную вкладку после перезагрузки (а не всегда «Обзор»)
  try{
    const sr = sessionStorage.getItem('ref_role'); if(sr && MENUS[sr]) role = sr;
    const sp = sessionStorage.getItem('ref_page');
    page = (sp && MENUS[role].some(m=>m[0]===sp)) ? sp : MENUS[role][0][0];
  }catch(e){}
  render();
  if(token){ const [a,b]=dayRange(0); loadLive(a,b,'Сегодня'); loadReferrers(); loadDailySeries(); loadChartSeries(); }
  else { setBadge('demo'); showLogin(); }
})();
</script>
